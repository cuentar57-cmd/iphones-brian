<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Catálogo Brian</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ====== FONDO ====== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #0b1d33, #020817);
  color: #fff;
  overflow-x: hidden;
}

/* Copos de nieve */
.snowflake {
  position: fixed;
  top: -10px;
  color: white;
  font-size: 12px;
  opacity: 0.8;
  animation: fall linear infinite;
}
@keyframes fall {
  to { transform: translateY(110vh); }
}

/* ====== NAV ====== */
nav {
  display: flex;
  justify-content: center;
  gap: 30px;
  padding: 15px;
  background: rgba(0,0,0,0.4);
  position: sticky;
  top: 0;
  z-index: 10;
}
nav button {
  background: none;
  border: none;
  color: #6ecbff;
  font-size: 18px;
  cursor: pointer;
  transition: transform .2s;
}
nav button:hover {
  transform: scale(1.2);
}

/* ====== SECCIONES ====== */
section {
  max-width: 1000px;
  margin: auto;
  padding: 30px 15px;
}
.hidden { display: none; }

/* ====== PRODUCTO ====== */
.product {
  border: 2px solid #3ecbff;
  border-radius: 14px;
  padding: 15px;
  margin-bottom: 20px;
  background: rgba(255,255,255,0.03);
  animation: glow 2s infinite alternate;
}
@keyframes glow {
  from { box-shadow: 0 0 10px #3ecbff55; }
  to { box-shadow: 0 0 18px #3ecbffaa; }
}

.product h3 {
  margin: 0 0 10px;
}

/* ====== BADGE USADO ====== */
.badge-usado {
  background: linear-gradient(135deg, #ff9800, #ff5722);
  padding: 3px 8px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
  margin-left: 8px;
  animation: pulse 1.8s infinite;
}
@keyframes pulse {
  0% { box-shadow: 0 0 5px #ff9800; }
  50% { box-shadow: 0 0 15px #ff5722; }
  100% { box-shadow: 0 0 5px #ff9800; }
}

.info {
  font-size: 14px;
  margin-bottom: 8px;
}

.price {
  font-size: 20px;
  color: #6ecbff;
  font-weight: bold;
}

/* ====== BOTÓN ====== */
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 18px;
  background: #3ecbff;
  color: #000;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
}

/* ====== PAGINACIÓN ====== */
.pagination {
  text-align: center;
  margin-top: 20px;
}
.pagination button {
  margin: 0 5px;
  padding: 6px 12px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
  <button onclick="showSection('iphones')">📱 iPhones</button>
  <button onclick="showSection('ps5')">🎮 PS5</button>
  <button onclick="showSection('auris')">🎧 Auriculares</button>
</nav>

<!-- IPHONES -->
<section id="iphones">
  <div id="iphone-list"></div>

  <div class="pagination">
    <button onclick="prevPage()">◀</button>
    <span id="pageNum">1</span>
    <button onclick="nextPage()">▶</button>
  </div>
</section>

<!-- PS5 -->
<section id="ps5" class="hidden">
  <div class="product">
    <h3>PlayStation 5</h3>
    <div class="info">Edición Standard • 1TB</div>
    <div class="price">$850.000</div>
    <a class="btn" href="https://wa.me/5493585079522" target="_blank">Consultar</a>
  </div>
</section>

<!-- AURIS -->
<section id="auris" class="hidden">
  <div class="product">
    <h3>Auriculares Inalámbricos</h3>
    <div class="info">Bluetooth • Cancelación de ruido</div>
    <div class="price">$65.000</div>
    <a class="btn" href="https://wa.me/5493585079522" target="_blank">Consultar</a>
  </div>
</section>

<script>
/* ====== DATOS IPHONES ====== */
const iphones = [
  {name:"iPhone 11", used:true, battery:100, storage:"128GB", price:"$330.000"},
  {name:"iPhone 11 Pro", used:true, battery:100, storage:"64GB", price:"$358.000"},
  {name:"iPhone 11 Pro Max", used:true, battery:100, storage:"256GB", price:"$416.000"},
  {name:"iPhone 12", used:true, battery:100, storage:"64GB", price:"$380.000"},
  {name:"iPhone 12 Pro", used:true, battery:92, storage:"128GB", price:"$430.000"},
  {name:"iPhone 13", used:true, battery:90, storage:"128GB", price:"$520.000"},
  {name:"iPhone 14 Pro", used:true, battery:88, storage:"128GB", price:"$680.000"},
  {name:"iPhone 15 Pro", used:false, battery:100, storage:"256GB", price:"$950.000"},
  {name:"iPhone 16", used:false, battery:100, storage:"256GB", price:"$1.050.000"},
  {name:"iPhone 16 Pro", used:true, battery:95, storage:"256GB", price:"$1.180.000"},
  {name:"iPhone 16 Pro Max", used:false, battery:100, storage:"512GB", price:"$1.350.000"},
  {name:"iPhone 17 Pro Max", used:false, battery:100, storage:"512GB", price:"$1.600.000"}
];

let page = 1;
const perPage = 10;

function renderIphones() {
  const list = document.getElementById("iphone-list");
  list.innerHTML = "";
  const start = (page - 1) * perPage;
  const end = start + perPage;

  iphones.slice(start, end).forEach(p => {
    list.innerHTML += `
      <div class="product">
        <h3>${p.name} ${p.used ? '<span class="badge-usado">USADO</span>' : ''}</h3>
        <div class="info">🔋 Batería: ${p.battery}% • 💾 ${p.storage}</div>
        <div class="price">${p.price}</div>
        <a class="btn" href="https://wa.me/5493585079522" target="_blank">Consultar</a>
      </div>
    `;
  });

  document.getElementById("pageNum").innerText = page;
}

function nextPage() {
  if (page * perPage < iphones.length) {
    page++;
    renderIphones();
  }
}
function prevPage() {
  if (page > 1) {
    page--;
    renderIphones();
  }
}

function showSection(id) {
  document.querySelectorAll("section").forEach(s => s.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
}

/* ====== NIEVE ====== */
for (let i = 0; i < 40; i++) {
  const s = document.createElement("div");
  s.className = "snowflake";
  s.innerText = "❄";
  s.style.left = Math.random()*100 + "vw";
  s.style.animationDuration = (5 + Math.random()*5) + "s";
  s.style.fontSize = (8 + Math.random()*10) + "px";
  document.body.appendChild(s);
}

renderIphones();
</script>

</body>
</html>
